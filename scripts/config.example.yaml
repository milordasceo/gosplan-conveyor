# критерии фильтра разведки gosplan.info
# копируй в config.yaml и правь под себя

base_url: https://v2test.gosplan.info   # тестовый сервер, без api-ключа; прод: https://v2.gosplan.info (нужен ключ)
api_key: null                            # прод-ключ, если есть; кладётся в заголовок X-Api-Key

sources:                                 # какие выборки опрашивать
  - fz44                                 # /fz44/purchases
  - fz223                                # /fz223/purchases

# пример / значение по умолчанию для --kind (раскомментируй целиком).
# без этого блока --kind завершается с ошибкой.
# purchase_kinds:
#   auction:   # аукцион
#     fz44: [epNotificationEF2020]
#     fz223: [purchaseNoticeAE, purchaseNoticeAESMBO, purchaseNoticeOA, purchaseNoticeAE94FZ]
#   zk:        # запрос котировок
#     fz44: [epNotificationEZK2020, epNotificationEZK]
#     fz223: [purchaseNoticeZK, purchaseNoticeZKESMBO]
#   ok:        # конкурс
#     fz44: [epNotificationEOK2020, epNotificationEOK, epNotificationEOKD, epNotificationEOKOU]
#     fz223: [purchaseNoticeOK, purchaseNoticeKESMBO]
#   zp:        # запрос предложений
#     fz44: [epNotificationEZP]
#     fz223: [purchaseNoticeZPESMBO]
#   ep:        # единственный поставщик
#     fz44: []          # в api нет кода извещения о закупке у ед. поставщика по 44-фз
#     fz223: [purchaseNoticeEP]

filters:
  keywords: []                          # слова по наименованию объекта закупки (ищутся и на сервере, и повторно на клиенте)
  keywords_all: false                   # true = все слова обязательны; false = любое
  okpd2: []                             # ОКПД2/ОКВЭД группы, напр. ["33.20", "26.20.11.110-00000165"]
  min_budget: null                      # нижняя граница начальной (макс.) цены, руб
  max_budget: null                      # верхняя граница, руб
  published_after: null                 # дата публикации "с", ISO 8601, напр. 2026-10-01T00:00:00+03:00
  published_before: null                # дата публикации "по"
  since: today                          # то же, что --since: today или YYYY-MM-DD; перекрывается флагом
  # правило владельца: только тендеры, у которых до окончания подачи заявок от 2 до 10 дней.
  # +2d/+10d (дни) или +12h (часы) — от момента запуска (москва), фиксируются один раз на прогон;
  # можно now, YYYY-MM-DD или iso. меньше 2 дней — не выгружаем (expired), больше 10 — позже (too_early)
  deadline_from: '+2d'                  # окончание подачи заявок не раньше чем через 2 дня
  deadline_to: '+10d'                   # и не позже чем через 10 дней
  kinds: []                             # виды, как --kind: auction, zk, ok, zp, ep. пусто = не сужать
  types: []                             # законы 44 и/или 223; пусто = берётся sources
  regions: []                           # коды регионов KLADR, напр. [23, 77]
  stage: 1                              # 1 подача заявок | 2 работа комиссии | 3 завершена | 4 отменена
  currency: null                        # код валюты, напр. RUB

run:
  limit: 0                              # сколько выгрузить за прогон; 0 = без лимита. cli --limit важнее

export:
  dir: ""                               # непустое — режим выгрузки, путь от папки этого файла. --no-export отключает
  city_strict: false                    # true = не писать закупки вне города

limits:
  page_size: 100                        # максимум API = 100
  max_pages_per_source: 50              # страховка от бесконечного обхода
  pause_ms: 600                         # пауза между страницами, не дёргаем сервер
  timeout_sec: 30

output:
  dir: tenders                          # каталог относительно папки скрипта
  keep_days: 90                         # сколько прогона-отчётов хранить; 0 = не чистить

# state_dir: cache                      # слот api; относительно этого файла. иначе папка скрипта или GOSPLAN_STATE_DIR
